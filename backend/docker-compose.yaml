services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/app:/app/backend
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
    restart: unless-stopped
